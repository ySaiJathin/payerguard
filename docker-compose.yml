# PayerGuard local development stack.
# Frontend is now a real service (frontend/Dockerfile), containerized the
# same way as backend, now that real frontend source exists (MVP_CONTEXT.md
# Section 4.1) -- see the frontend service below for why it has no
# API_BASE_URL override.
# No live-streaming ingestion service -- ingestion happens via the backend's
# POST /claims/upload (manual + repeated-batch upload against the mounted
# data/ folder; spec 017-batch-file-ingestion).

services:
  postgres:
    image: postgres:16-alpine
    container_name: payerguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payerguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payerguard}
      POSTGRES_DB: ${POSTGRES_DB:-payerguard}
    ports:
      - "5432:5432"
    volumes:
      - payerguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payerguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: payerguard-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-payerguard}:${POSTGRES_PASSWORD:-payerguard}@postgres:5432/${POSTGRES_DB:-payerguard}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: payerguard-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    # No API_BASE_URL override, deliberately: it's a Vite build-time value
    # baked into the served JS bundle, and the bundle runs in the *browser*
    # on the host -- not inside this Docker network -- so it must resolve
    # `localhost:8000` (backend's host-mapped port below), which is exactly
    # what apiClient.ts already defaults to when unset. Pointing it at the
    # internal service hostname `backend` would be unreachable from a
    # browser tab.
    # No source bind-mount: the built image serves a static production
    # bundle via nginx, unlike backend's live-reload dev volume above.

volumes:
  payerguard_pgdata:
