# SPA fallback: React Router owns client-side routing (App.tsx), so any
# path nginx doesn't have a static file for must still serve index.html
# rather than a bare 404 -- otherwise a hard refresh on e.g. /simulator
# breaks.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
